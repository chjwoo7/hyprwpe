[workspace]
resolver = "2"
members = ["crates/core", "crates/render", "crates/hyprwpe", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/chjwoo7/hyprwpe"

[workspace.dependencies]
hyprwpe-core = { path = "crates/core" }
hyprwpe-render = { path = "crates/render" }
smithay-client-toolkit = "0.21"
khronos-egl = { version = "6", features = ["dynamic"] }
wayland-egl = "0.32"
glow = "0.18"
libmpv-sys = "3.1"
libloading = "0.8"
wayland-client = "0.31"
gtk4 = { version = "0.11", features = ["v4_10"] }
libadwaita = { version = "0.9", features = ["v1_5"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
