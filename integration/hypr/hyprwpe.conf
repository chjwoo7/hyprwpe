# hyprwpe - Hyprland Configuration Snippet
#
# Source this file from your hyprland.conf:
#   source = ~/.config/hypr/hyprwpe.conf
# or copy the directives below directly into your configuration.

# Launch hyprwpe wallpaper daemon at login
exec-once = hyprwpe daemon

# Keybindings
# Open GTK4 graphical wallpaper picker (Super + W)
bind = $mainMod, W, exec, hyprwpe-gui

# Pause / Resume wallpaper rendering (e.g. for heavy fullscreen workloads)
bind = $mainMod SHIFT, W, exec, hyprwpe pause
bind = $mainMod CTRL, W, exec, hyprwpe resume
