# hyprwpe for Hyprland — source this from hyprland.conf:
#
#     source = ~/path/to/hyprwpe/integration/hypr/hyprwpe.conf

# The daemon owns the wallpaper for the whole session. It restores whatever was
# showing last time, so nothing else is needed at login.
exec-once = hyprwpe daemon

# Open the picker. Change the binding to taste.
bind = SUPER, W, exec, hyprwpe-gui

# If you use a quickshell-based shell (end4, end4-pC, dots-chjwoo), stop it from
# painting its own wallpaper while hyprwpe is running, or it will cover the
# layer hyprwpe draws on. See docs/ARCHITECTURE.md, "Shell integration".
